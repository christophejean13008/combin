/* Mise en page : barre d'outils fine en haut, puis les routes empilées qui se partagent toute la hauteur de l'écran */
:root{
  --sky1:#bfe0ee; --sky2:#e9f4ee; --grass:#86b56b; --road:#414a57; --dash:#f3e9c6;
  --tile:#fffdf6; --tile-edge:#2b3440; --tile-shadow:#2b344033; --vowel:#d6312b; --cons:#1f5fbf; --plain:#2b3440; --fuse:#ffe27a;
  --bar:#20303f; --bar-fg:#f2f6f8; --bar-soft:#34485a; --accent:#f2a900; --accent-ink:#231a00;
  --panel:#fbfaf5; --panel-fg:#22303c; --panel-line:#d0d6d3; --muted:#5a6873; --veil:#10182066;
  --car1:#e2543d; --car2:#f2a900; --car3:#3f9d6b; --car4:#8a5cc2;
  --glass:#dff1f7; --tyre:#1c2128; --hub:#d9dee2; --lamp:#fff3b0; --car-edge:#2b3440;
  --font-letters:"Andika","Lexend","Trebuchet MS",Verdana,sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#142233; --sky2:#27394b; --grass:#2f4a3a; --road:#1b2027; --dash:#cfc59b;
    --tile:#f6f2e6; --tile-edge:#0d1218; --tile-shadow:#00000066; --fuse:#ffd95a;
    --bar:#0e1620; --bar-fg:#e8eef2; --bar-soft:#22303d; --accent:#f2a900; --accent-ink:#231a00;
    --panel:#17212b; --panel-fg:#e8eef2; --panel-line:#34424f; --muted:#9fb0bc; --veil:#00000088;
    --glass:#9fc4d4; --tyre:#0b0e12; --hub:#aab3ba; --lamp:#ffe98a; --car-edge:#0d1218;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#142233; --sky2:#27394b; --grass:#2f4a3a; --road:#1b2027; --dash:#cfc59b;
  --tile:#f6f2e6; --tile-edge:#0d1218; --tile-shadow:#00000066; --fuse:#ffd95a;
  --bar:#0e1620; --bar-fg:#e8eef2; --bar-soft:#22303d; --accent:#f2a900; --accent-ink:#231a00;
  --panel:#17212b; --panel-fg:#e8eef2; --panel-line:#34424f; --muted:#9fb0bc; --veil:#00000088;
  --glass:#9fc4d4; --tyre:#0b0e12; --hub:#aab3ba; --lamp:#ffe98a; --car-edge:#0d1218;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--panel-fg);font-family:var(--font-ui);font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.rig:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column}

/* Barre d'outils */
.bar{background:var(--bar);color:var(--bar-fg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.brand{font-family:var(--font-letters);font-size:1.25rem;letter-spacing:.01em;margin-right:4px}
.brand b{color:var(--accent);font-weight:400}
.seg{display:flex;background:var(--bar-soft);border-radius:999px;padding:3px;min-width:0}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tools button{border:1px solid var(--bar-soft);background:transparent;border-radius:10px;padding:8px 12px;min-height:40px}
.tools button:hover{background:var(--bar-soft)}

/* Scène */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden}
.lane{flex:1;min-height:0;position:relative;overflow:hidden;--t:80px;--bw:max(2px,calc(var(--t)*.035));--base:calc(6px + var(--t)*.25)}
.lane::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--t)*.5 + 18px);background:var(--grass)}
.road{position:absolute;left:0;right:0;bottom:6px;height:calc(var(--t)*.5);background:var(--road)}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(3px,calc(var(--t)*.04));transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--dash) 0 calc(var(--t)*.5),transparent calc(var(--t)*.5) calc(var(--t)*.95))}

.tile{height:var(--t);min-width:var(--t);padding:0 calc(var(--t)*.16);display:inline-block;text-align:center;white-space:nowrap;
  font-family:var(--tile-font,var(--font-letters));font-size:calc(var(--t)*var(--fs,.64));line-height:calc(var(--t)*.9);color:var(--plain);
  background:var(--tile);border:var(--bw) solid var(--tile-edge);border-radius:calc(var(--t)*.16);
  box-shadow:0 calc(var(--t)*.05) 0 var(--tile-shadow);user-select:none;-webkit-user-select:none}
.caps .tile{text-transform:uppercase}
.colors .tile .v{color:var(--vowel)}
.colors .tile .c{color:var(--cons)}

.target{position:absolute;left:0;bottom:var(--base);transform-origin:left bottom;transition:transform .35s ease,background-color .15s}
.target.hit{background:var(--fuse);border-left-width:0;padding-left:calc(var(--t)*.16 + var(--bw));border-top-left-radius:0;border-bottom-left-radius:0}
.target.trace{transform:translateY(calc(var(--t)*-1.12)) scale(.55);box-shadow:none}

.rig{position:absolute;left:0;bottom:calc(6px + var(--t)*.12);display:flex;align-items:flex-end;gap:calc(var(--t)*.06);
  touch-action:none;cursor:grab;will-change:transform;z-index:2}
.rig:active{cursor:grabbing}
.rig.glide{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.rig .pusher{margin-bottom:calc(var(--t)*.13)}
.fused .rig .pusher{background:var(--fuse);border-right-width:0;padding-right:calc(var(--t)*.16 + var(--bw));border-top-right-radius:0;border-bottom-right-radius:0}
.fused .rig{gap:calc(var(--t)*.06)}

.car{width:calc(var(--t)*1.9);height:auto;display:block;flex:none;pointer-events:none}
.car .body{fill:var(--car);stroke:var(--car-edge);stroke-width:4;stroke-linejoin:round}
.car .glass{fill:var(--glass);stroke:var(--car-edge);stroke-width:3;stroke-linejoin:round}
.car .lamp{fill:var(--lamp);stroke:var(--car-edge);stroke-width:3}
.car .tyre{fill:var(--tyre)}
.car .hub{fill:var(--hub)}
.car .spoke{stroke:var(--hub);stroke-width:3;fill:none}
.car .wh{transform-box:fill-box;transform-origin:center}

.acts{position:absolute;left:0;bottom:calc(var(--base) + var(--t) + 10px);display:flex;gap:8px;z-index:3}
.act{width:max(44px,calc(var(--t)*.55));height:max(44px,calc(var(--t)*.55));border-radius:50%;border:max(2px,calc(var(--t)*.03)) solid var(--car-edge);
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0}
.act.listen{background:var(--tile);color:var(--plain)}
.act svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Réglages */
.veil{position:fixed;inset:0;background:var(--veil);z-index:9}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);color:var(--panel-fg);z-index:10;
  overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;
  border-left:1px solid var(--panel-line)}
.panel h2{font-family:var(--font-letters);font-weight:400;font-size:1.5rem;margin:0;text-wrap:balance}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.panel p{margin:0;color:var(--muted);line-height:1.45;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;height:48px;padding:0 12px;border-radius:10px;border:2px solid var(--panel-line);background:transparent;
  font-family:var(--font-letters);font-size:1.4rem;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--panel-fg);background:var(--fuse);color:#231a00}
.chip.txt{font-family:var(--font-ui);font-size:1rem}
.close{border:2px solid var(--panel-line);background:transparent;border-radius:10px;padding:8px 14px;min-height:44px}
.note{font-size:.9rem}

@media (max-width:640px){
  .tools{margin-left:0}
  .brand{width:100%}
}
@media (prefers-reduced-motion:reduce){.rig.glide,.target{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <span class="brand">Adapt<b>syllabe</b></span>
    <div class="seg" role="group" aria-label="Type d'exercice">
      <button id="mode-cv" data-mode="cv" aria-pressed="true">Syllabe</button>
      <button id="mode-vc" data-mode="vc" aria-pressed="false">Inversée</button>
      <button id="mode-mot" data-mode="mot" aria-pressed="false">Mot</button>
    </div>
    <div class="tools">
      <button id="btn-new">Nouvelles lettres</button>
      <button id="btn-set">Réglages</button>
      <button id="btn-full">Plein écran</button>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<div class="veil" id="veil" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Réglages">
  <div class="panel-head">
    <h2>Réglages</h2>
    <button class="close" id="btn-close">Fermer</button>
  </div>
  <p>La voiture pousse la lettre jusqu'à la suivante. Les élèves tiennent le son pendant tout le trajet, puis lisent la syllabe quand les deux étiquettes se touchent.</p>
  <section>
    <h3>Consonnes</h3>
    <div class="chips" id="chips-cons"></div>
  </section>
  <section>
    <h3>Voyelles</h3>
    <div class="chips" id="chips-voy"></div>
  </section>
  <p class="note" id="note"></p>
  <section>
    <h3>Nombre de routes</h3>
    <div class="chips" id="chips-lanes"></div>
  </section>
  <section>
    <h3>Police des étiquettes</h3>
    <div class="chips" id="chips-font"></div>
  </section>
  <section>
    <h3>Affichage</h3>
    <div class="chips">
      <button class="chip txt" id="opt-colors" aria-pressed="true">Voyelles rouges, consonnes bleues</button>
      <button class="chip txt" id="opt-caps" aria-pressed="false">MAJUSCULES</button>
      <button class="chip txt" id="opt-listen" aria-pressed="true">Bouton d'écoute</button>
    </div>
  </section>
</aside>

<script>
(function(){
  var CONS=['l','m','r','s','f','n','v','j','ch','p','t','b','d','z'];
  var VOY=['a','i','o','u','e','é','ou'];
  var VC_CONS=['l','r','s','f','p','t'], VC_VOY=['a','i','o','u','ou'];
  var WORDS=('moto lama mari papa puma sofa judo vélo bébé fumé tata tutu dodo loto midi pari relu salé sali lavé levé tapé limé ramé ridé '+
    'rira lira sera fera dira vola tira nana pavé puni fini poli joli bobo toutou doudou loulou nounou joujou moulu voulu roulé chouchou '+
    'niché taché léché sumo solo polo mémé pépé rami mené semé tenu venu revu zéro zébu tabou bijou minou filou matou chéri douché touché bouché séché fiché').split(' ');
  // Ce que la voix doit prononcer pour que la syllabe sonne juste
  var SAY={mo:'mot',lo:"l'eau",ro:'rot',so:'seau',fo:'faux',no:'nos',vo:'vos',po:'pot',to:'tôt',bo:'beau','do':'dos',cho:'chaud',
    mi:'mie',li:'lit',ri:'riz',fi:'fit',ni:'nid',vi:'vie',pi:'pie',di:'dit',ra:'rat',pa:'pas',ba:'bas',cha:'chat',
    mu:'mue',ru:'rue',fu:'fut',ju:'jus',
    al:'alle',ol:'olle',ul:'ule',oul:'oule',ar:'art',ir:'ire',ur:'ure',as:'asse',is:'isse',us:'usse',ous:'ousse',
    af:'affe',of:'off',uf:'uffe',ap:'appe',ip:'ippe',op:'hop',up:'uppe',oup:'houppe',at:'atte',it:'ite',ot:'hotte',out:'oute'};
  var FONTS=[
    {id:'andika',label:'Andika',css:'"Andika"',fs:.64},
    {id:'lexend',label:'Lexend',css:'"Lexend"',fs:.62},
    {id:'atkinson',label:'Atkinson',css:'"Atkinson Hyperlegible"',fs:.66},
    {id:'dys',label:'OpenDyslexic',css:'"OpenDyslexic"',fs:.52},
    {id:'cursive',label:'Cursive',css:'"Playwrite FR Moderne"',fs:.46}];
  var PAD=16, KEY='adaptsyllabe';
  var S={mode:'cv',cons:['m','l','r','s'],voy:['a','i','o','u'],lanes:3,caps:false,colors:true,listen:true,font:'andika'};
  try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){for(var k in S){if(saved[k]!==undefined)S[k]=saved[k];}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  var $=function(id){return document.getElementById(id);};
  var app=$('app'),stage=$('stage'),panel=$('panel'),veil=$('veil');
  var lanes=[];
  var canSpeak=('speechSynthesis' in window);

  var CAR='<svg class="car" viewBox="0 0 200 110" aria-hidden="true">'+
    '<path class="body" d="M8 82Q8 56 40 52L60 26Q67 16 82 16H126Q141 16 149 27L167 52Q193 56 193 80V86Q193 93 186 93H15Q8 93 8 86Z"/>'+
    '<path class="glass" d="M52 52L67 31Q70 27 76 27H97V52Z"/><path class="glass" d="M106 27H127Q134 27 138 32L152 52H106Z"/>'+
    '<circle class="lamp" cx="185" cy="68" r="6"/>'+
    '<g class="wh"><circle class="tyre" cx="52" cy="92" r="17"/><circle class="hub" cx="52" cy="92" r="7"/><path class="spoke" d="M52 77V107M37 92H67"/></g>'+
    '<g class="wh"><circle class="tyre" cx="150" cy="92" r="17"/><circle class="hub" cx="150" cy="92" r="7"/><path class="spoke" d="M150 77V107M135 92H165"/></g></svg>';
  var ICON={
    listen:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
    next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
    again:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg>'
  };

  function tokens(w){return w.match(/ch|ou|[a-zàâéèêîôû]/g)||[];}
  function isVowel(t){return /^(ou|[aeiouyàâéèêîôû])$/.test(t);}
  function markup(text){return tokens(text).map(function(t){return '<span class="'+(isVowel(t)?'v':'c')+'">'+t+'</span>';}).join('');}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function inter(a,b){return a.filter(function(x){return b.indexOf(x)>=0;});}
  function pools(){
    if(S.mode==='vc'){
      var c=inter(S.cons,VC_CONS),v=inter(S.voy,VC_VOY);
      return {cons:c.length?c:['l','r','s'],voy:v.length?v:['a','i','o']};
    }
    return {cons:S.cons,voy:S.voy};
  }
  function possibleWords(){
    return WORDS.filter(function(w){var t=tokens(w);
      return S.cons.indexOf(t[0])>=0&&S.cons.indexOf(t[2])>=0&&S.voy.indexOf(t[1])>=0&&S.voy.indexOf(t[3])>=0;});
  }
  function pick(list,avoid){var free=list.filter(function(x){return avoid.indexOf(x)<0;});var src=free.length?free:list;return src[Math.floor(Math.random()*src.length)];}

  function fill(lane){
    var W=stage.clientWidth,k=W<600?2:3,p=pools();
    var used=lanes.filter(function(l){return l!==lane;}).map(function(l){return l.key;});
    var targets;
    if(S.mode==='mot'){
      var list=possibleWords();if(!list.length)list=WORDS;
      var w=pick(list,used.concat(lane.key?[lane.key]:[])),t=tokens(w);
      lane.key=w;lane.pusher=t[0]+t[1];targets=[t.slice(2).join('')];
    }else if(S.mode==='vc'){
      lane.pusher=pick(p.voy,used);lane.key=lane.pusher;targets=shuffle(p.cons).slice(0,k);
    }else{
      lane.pusher=pick(p.cons,used);lane.key=lane.pusher;targets=shuffle(p.voy).slice(0,k);
    }
    lane.targets.forEach(function(t){t.el.remove();});
    lane.pusherEl.innerHTML=markup(lane.pusher);
    lane.targets=targets.map(function(txt){
      var el=document.createElement('span');el.className='tile target';el.innerHTML=markup(txt);
      lane.el.insertBefore(el,lane.rig);return {el:el,text:txt,x:0};
    });
    lane.idx=0;lane.x=PAD;
  }

  function buildStage(){
    stage.innerHTML='';lanes=[];
    for(var i=0;i<S.lanes;i++){(function(i){
      var el=document.createElement('div');el.className='lane';el.style.setProperty('--car','var(--car'+(i%4+1)+')');
      el.innerHTML='<div class="road"></div><div class="rig" tabindex="0" role="slider" aria-label="Voiture '+(i+1)+'">'+CAR+
        '<span class="tile pusher"></span></div><div class="acts" hidden>'+
        '<button class="act listen" aria-label="Écouter la syllabe">'+ICON.listen+'</button>'+
        '<button class="act next" hidden aria-label="Continuer">'+ICON.next+'</button></div>';
      stage.appendChild(el);
      var lane={el:el,rig:el.querySelector('.rig'),pusherEl:el.querySelector('.pusher'),acts:el.querySelector('.acts'),
        wheels:el.querySelectorAll('.wh'),targets:[],idx:0,x:PAD,max:PAD,T:80,drag:null,key:''};
      lanes.push(lane);bind(lane);
    })(i);}
    lanes.forEach(fill);layout();
  }

  function layout(){
    lanes.forEach(function(lane){
      var H=lane.el.clientHeight,W=lane.el.clientWidth;
      if(!H||!W)return;
      var T=Math.max(34,Math.min((H-24)/2,W/9,170));
      lane.T=T;lane.el.style.setProperty('--t',T+'px');
      var rigW=lane.rig.offsetWidth,n=lane.targets.length;
      var lastW=n?lane.targets[n-1].el.offsetWidth:T;
      var start=PAD+rigW+T*0.5,end=W-PAD-lastW;
      if(end<start)end=start;
      lane.targets.forEach(function(t,i){t.x=start+(i+1)/n*(end-start);t.el.style.left=t.x+'px';});
      lane.rigW=rigW;lane.carW=T*1.9;
      setX(lane,lane.x);
    });
  }

  function setX(lane,x){
    var t=lane.targets[lane.idx];
    lane.max=t?t.x-lane.rigW:lane.el.clientWidth-PAD-lane.rigW;
    if(lane.max<PAD)lane.max=PAD;
    lane.x=Math.max(PAD,Math.min(x,lane.max));
    render(lane);
  }
  function render(lane){
    lane.rig.style.transform='translate3d('+lane.x+'px,0,0)';
    var deg=(lane.x/(lane.carW*17/200))*57.2958;
    lane.wheels.forEach(function(w){w.style.transform='rotate('+deg+'deg)';});
    var t=lane.targets[lane.idx],fused=!!t&&lane.x>=lane.max-0.5;
    lane.el.classList.toggle('fused',fused);
    lane.targets.forEach(function(o,i){o.el.classList.toggle('hit',fused&&i===lane.idx);});
    lane.acts.hidden=!fused;
    if(fused){
      lane.acts.style.left=(lane.x+lane.rigW-lane.pusherEl.offsetWidth)+'px';
      var last=lane.idx===lane.targets.length-1;
      var nb=lane.acts.querySelector('.next');
      nb.innerHTML=last?ICON.again:ICON.next;
      nb.setAttribute('aria-label',last?(S.mode==='mot'?'Nouveau mot':'Nouvelle lettre'):'Continuer vers la lettre suivante');
      lane.acts.querySelector('.listen').hidden=!(S.listen&&canSpeak);
    }
    lane.rig.setAttribute('aria-valuetext',fused?lane.pusher+t.text:lane.pusher);
  }

  function next(lane){
    var t=lane.targets[lane.idx];if(!t)return;
    lane.armed=false;
    if(lane.idx>=lane.targets.length-1){
      fill(lane);lane.rig.classList.add('glide');layout();
      setTimeout(function(){lane.rig.classList.remove('glide');},600);
      return;
    }
    t.el.innerHTML=markup(lane.pusher+t.text);
    t.el.classList.remove('hit');t.el.classList.add('trace');
    lane.idx++;setX(lane,lane.x);
  }

  var voice=null;
  function findVoice(){if(!canSpeak)return;var vs=speechSynthesis.getVoices();
    voice=vs.filter(function(v){return /^fr/i.test(v.lang);})[0]||null;}
  if(canSpeak){findVoice();try{speechSynthesis.addEventListener('voiceschanged',findVoice);}catch(e){}}
  function speak(text){
    if(!canSpeak)return;
    try{speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(SAY[text]||text);u.lang='fr-FR';u.rate=0.8;if(voice)u.voice=voice;
      speechSynthesis.speak(u);}catch(e){}
  }

  function bind(lane){
    var rig=lane.rig;
    rig.addEventListener('pointerdown',function(e){
      if(lane.drag)return;
      // Deuxième appui sur la voiture après une fusion : elle repart vers la lettre suivante
      if(lane.armed&&lane.el.classList.contains('fused')){
        var wasLast=lane.idx>=lane.targets.length-1;
        lane.armed=false;next(lane);
        if(wasLast){e.preventDefault();return;}
      }
      lane.armed=false;
      try{rig.setPointerCapture(e.pointerId);}catch(err){}
      rig.classList.remove('glide');
      lane.drag={id:e.pointerId,dx:e.clientX-lane.x};e.preventDefault();
    });
    rig.addEventListener('pointermove',function(e){
      if(!lane.drag||e.pointerId!==lane.drag.id)return;
      setX(lane,e.clientX-lane.drag.dx);
    });
    function end(e){
      if(!lane.drag||e.pointerId!==lane.drag.id)return;
      lane.drag=null;
      if(lane.targets[lane.idx]&&lane.max-lane.x<lane.T*0.2)setX(lane,lane.max);
      lane.armed=lane.el.classList.contains('fused');
    }
    rig.addEventListener('pointerup',end);rig.addEventListener('pointercancel',end);
    rig.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'){setX(lane,lane.x+lane.T*0.3);e.preventDefault();}
      if(e.key==='ArrowLeft'){setX(lane,lane.x-lane.T*0.3);e.preventDefault();}
    });
    lane.acts.querySelector('.next').addEventListener('click',function(){next(lane);});
    lane.acts.querySelector('.listen').addEventListener('click',function(){
      var t=lane.targets[lane.idx];if(t)speak(lane.pusher+t.text);
    });
  }

  /* Barre d'outils et réglages */
  function chip(label,pressed,cls){var b=document.createElement('button');b.className='chip'+(cls?' '+cls:'');b.textContent=label;
    b.setAttribute('aria-pressed',pressed?'true':'false');return b;}
  function buildChips(){
    [['chips-cons',CONS,'cons'],['chips-voy',VOY,'voy']].forEach(function(cfg){
      var box=$(cfg[0]);box.innerHTML='';
      cfg[1].forEach(function(l){
        var b=chip(l,S[cfg[2]].indexOf(l)>=0);b.id='chip-'+cfg[2]+'-'+l;
        b.addEventListener('click',function(){
          var arr=S[cfg[2]],i=arr.indexOf(l);
          if(i>=0){if(arr.length<=1)return;arr.splice(i,1);}else arr.push(l);
          b.setAttribute('aria-pressed',arr.indexOf(l)>=0?'true':'false');
          changed();
        });
        box.appendChild(b);
      });
    });
    var fb=$('chips-font');fb.innerHTML='';
    FONTS.forEach(function(f){
      var b=chip(f.label,S.font===f.id,'txt');b.id='chip-font-'+f.id;b.style.fontFamily=f.css+',sans-serif';b.style.fontSize='1.15rem';
      b.addEventListener('click',function(){S.font=f.id;
        fb.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});
        save();refreshUI();applyFont();});
      fb.appendChild(b);
    });
    var lb=$('chips-lanes');lb.innerHTML='';
    [1,2,3,4].forEach(function(n){
      var b=chip(String(n),S.lanes===n,'txt');b.id='chip-lanes-'+n;
      b.addEventListener('click',function(){S.lanes=n;
        lb.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});
        changed();});
      lb.appendChild(b);
    });
  }
  function refreshUI(){
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===S.mode?'true':'false');});
    $('btn-new').textContent=S.mode==='mot'?'Nouveaux mots':'Nouvelles lettres';
    app.classList.toggle('caps',S.caps);app.classList.toggle('colors',S.colors);
    $('opt-colors').setAttribute('aria-pressed',S.colors?'true':'false');
    $('opt-caps').setAttribute('aria-pressed',S.caps?'true':'false');
    $('opt-listen').setAttribute('aria-pressed',S.listen?'true':'false');
    var note='';
    if(S.mode==='vc')note='En syllabe inversée, seules les consonnes l, r, s, f, p, t et les voyelles a, i, o, u, ou sont utilisées, pour éviter les sons an, on, in.';
    else if(S.mode==='mot'){var n=possibleWords().length;
      note=n?('Mots possibles avec ces lettres : '+n+'.'):'Aucun mot possible avec ces lettres seules : tous les mots de la liste sont proposés.';}
    else note='En mode Syllabe, la voiture pousse une consonne vers les voyelles choisies.';
    $('note').textContent=note;
  }
  function applyFont(){
    var f=FONTS.filter(function(x){return x.id===S.font;})[0]||FONTS[0];
    app.style.setProperty('--tile-font',f.css+',"Trebuchet MS",Verdana,sans-serif');
    app.style.setProperty('--fs',f.fs);
    layout();
    try{document.fonts.load('40px '+f.css).then(layout,function(){});}catch(e){}
  }
  function changed(){save();refreshUI();buildStage();}

  document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){S.mode=b.dataset.mode;changed();});});
  $('btn-new').addEventListener('click',function(){lanes.forEach(function(l){l.key='';});buildStage();});
  function openPanel(o){panel.hidden=!o;veil.hidden=!o;}
  $('btn-set').addEventListener('click',function(){openPanel(true);});
  $('btn-close').addEventListener('click',function(){openPanel(false);});
  veil.addEventListener('click',function(){openPanel(false);});
  $('opt-colors').addEventListener('click',function(){S.colors=!S.colors;save();refreshUI();});
  $('opt-caps').addEventListener('click',function(){S.caps=!S.caps;save();refreshUI();layout();});
  $('opt-listen').addEventListener('click',function(){S.listen=!S.listen;save();refreshUI();lanes.forEach(render);});
  var fs=$('btn-full');
  if(!document.documentElement.requestFullscreen)fs.hidden=true;
  fs.addEventListener('click',function(){
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}
    }catch(e){}
  });

  try{if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',layout);}catch(e){}

  buildChips();refreshUI();buildStage();applyFont();
  if(window.ResizeObserver)new ResizeObserver(layout).observe(stage);else window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
